name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) + provenance

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Set up Node for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node ships npm 10.x; trusted publishing (OIDC) needs >= 11.5.1.
      # Without this the publish fails on auth in a way that looks nothing like
      # a version problem. Pinned: this job can mint a publish token, so it must
      # not run whatever `npm@latest` happens to be.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.20.0

      - name: Check release tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # nlpp-grammar is a normal registry dependency (^1.0.1), so a plain install
      # pulls the published grammar (WASM included). Nothing is built or linked
      # from the grammar's source here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `npm publish` runs the prepublishOnly script (bun test && bun run build),
      # so tests and build are not repeated as separate steps.
      - name: Publish to npm
        run: npm publish --provenance --access public
