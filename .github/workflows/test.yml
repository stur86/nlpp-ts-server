name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      # nlpp-grammar is a normal registry dependency (^1.0.1) — a plain install
      # pulls the published grammar (WASM included); nothing is linked from source.
      # --frozen-lockfile fails the job if bun.lock is out of date instead of
      # silently resolving different versions from the ones committed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      # Catches type and declaration-build errors before they reach a release.
      - name: Build
        run: bun run build
